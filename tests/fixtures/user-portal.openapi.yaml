# Snapshot of external user portal OpenAPI spec used for local Prism-backed tests.
# Authoritative source (manual update only, no auto-sync):
# https://gitlab.com/ska-telescope/sdi/ska-ser-user-portal-backend/-/raw/9ef8cd36fd3cbb57920f013dd994482b9b7dcb53/docs/external-openapi.json
# Contract version: 1.1

components:
  schemas:
    ExternalError:
      description: 'The body of every error this API raises itself.


        ``detail`` is a sentence meant for a log or an operator, not a field-level

        report. FastAPI''s own request-validation failures answer with the array-shaped

        ``HTTPValidationError`` instead, which is why both appear in this document.'
      properties:
        detail:
          title: Detail
          type: string
      required:
      - detail
      title: ExternalError
      type: object
    ExternalGroupCard:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        display_name:
          title: Display Name
          type: string
        group_name:
          title: Group Name
          type: string
        iam_group_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Iam Group Id
        owner_iam_sub:
          title: Owner Iam Sub
          type: string
        status:
          title: Status
          type: string
      required:
      - group_name
      - display_name
      - status
      - iam_group_id
      - owner_iam_sub
      - created_at
      title: ExternalGroupCard
      type: object
    ExternalGroupCreateRequest:
      properties:
        display_name:
          maxLength: 256
          minLength: 1
          title: Display Name
          type: string
        group_name:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9._/:-]+$
          title: Group Name
          type: string
      required:
      - group_name
      - display_name
      title: ExternalGroupCreateRequest
      type: object
    ExternalGroupDeleteResponse:
      properties:
        status:
          title: Status
          type: string
      required:
      - status
      title: ExternalGroupDeleteResponse
      type: object
    ExternalGroupMember:
      properties:
        affiliation:
          anyOf:
          - type: string
          - type: 'null'
          title: Affiliation
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        iam_user_id:
          title: Iam User Id
          type: string
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        portal_user_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Portal User Id
        preferred_username:
          anyOf:
          - type: string
          - type: 'null'
          description: The Entra object id, which is also the user's INDIGO userName and the preferred_username claim of their INDIGO token. Null until the account exists in Entra. Not the same as Entra's own preferred_username claim, which is a UPN.
          title: Preferred Username
      required:
      - portal_user_id
      - iam_user_id
      - display_name
      title: ExternalGroupMember
      type: object
    ExternalGroupMembersResponse:
      properties:
        as_of:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: As Of
        members:
          items:
            $ref: '#/components/schemas/ExternalGroupMember'
          title: Members
          type: array
        stale:
          title: Stale
          type: boolean
      required:
      - members
      - as_of
      - stale
      title: ExternalGroupMembersResponse
      type: object
    ExternalInviteBulkCreateRequest:
      description: Create several invites for one group in one call.
      properties:
        invites:
          items:
            $ref: '#/components/schemas/ExternalInviteCreateRequest'
          maxItems: 100
          minItems: 1
          title: Invites
          type: array
      required:
      - invites
      title: ExternalInviteBulkCreateRequest
      type: object
    ExternalInviteBulkCreateResponse:
      description: 'Per-item results. The response is 200 even when some items failed.


        An item''s outcome is independent of its siblings: each create commits before

        the next one starts, so a duplicate cannot discard the rest.'
      properties:
        created:
          title: Created
          type: integer
        failed:
          title: Failed
          type: integer
        results:
          items:
            $ref: '#/components/schemas/ExternalInviteBulkItemResult'
          title: Results
          type: array
      required:
      - results
      - created
      - failed
      title: ExternalInviteBulkCreateResponse
      type: object
    ExternalInviteBulkItemResult:
      description: What happened to one item of a bulk request, in the order it was sent.
      properties:
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        index:
          title: Index
          type: integer
        invite:
          anyOf:
          - $ref: '#/components/schemas/ExternalInviteCard'
          - type: 'null'
        portal_user_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Portal User Id
        status:
          description: created, duplicate, not_found or invalid
          title: Status
          type: string
      required:
      - index
      - status
      title: ExternalInviteBulkItemResult
      type: object
    ExternalInviteCard:
      properties:
        accepted_via:
          anyOf:
          - type: string
          - type: 'null'
          title: Accepted Via
        claim_state:
          title: Claim State
          type: string
        claimed_by_portal_user_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Claimed By Portal User Id
        created_at:
          format: date-time
          title: Created At
          type: string
        email_mismatch:
          title: Email Mismatch
          type: boolean
        expires_at:
          format: date-time
          title: Expires At
          type: string
        group_name:
          title: Group Name
          type: string
        invite_id:
          format: uuid
          title: Invite Id
          type: string
        invited_by:
          title: Invited By
          type: string
        invited_by_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Invited By Email
        invited_email:
          title: Invited Email
          type: string
        responded_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Responded At
        status:
          title: Status
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - invite_id
      - group_name
      - invited_email
      - invited_by
      - status
      - claim_state
      - accepted_via
      - email_mismatch
      - claimed_by_portal_user_id
      - created_at
      - updated_at
      - expires_at
      - responded_at
      title: ExternalInviteCard
      type: object
    ExternalInviteCreateRequest:
      description: 'Invite by ``portal_user_id`` (preferred) or by raw ``email``.


        Supply at least one; ``portal_user_id`` wins when both are present. It is the

        same ``portal_user_id`` Search/Look-up return (``user_records.id``) and is

        resolved server-side to that account''s contact email — the invite is keyed on

        email either way, so a ``portal_user_id`` and its matching address are

        interchangeable. ``email`` is the fallback for someone with no portal account

        yet (Search returned ``portal_user_id: null``, or no hit at all).


        Note ``portal_user_id`` — not ``iam_user_id``: the portal id spans the whole

        onboarding lifecycle, whereas a user has no INDIGO id until provisioned.'
      properties:
        email:
          anyOf:
          - format: email
            type: string
          - type: 'null'
          title: Email
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the invitation stops working. Must carry a timezone, be in the future, and be no more than INVITE_EXPIRES_MAX_HOURS ahead (168 hours by default). Omitted, the default lifetime applies.
          title: Expires At
        portal_user_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Portal User Id
      title: ExternalInviteCreateRequest
      type: object
    ExternalInviteListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ExternalInviteCard'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - items
      title: ExternalInviteListResponse
      type: object
    ExternalInviteRevokeResponse:
      properties:
        status:
          title: Status
          type: string
      required:
      - status
      title: ExternalInviteRevokeResponse
      type: object
    ExternalMemberAddRequest:
      description: "Add an already-provisioned user to the group directly.\n\nName the identifier you hold. Exactly one field, or the request is refused\nbefore anything is resolved. Nothing falls through: a handle that is unknown in\nthe namespace you named is a 404, never a retry in another namespace.\n\n* ``portal_user_id`` — ``user_records.id`` when it is a UUID (what Search and\n  Look-up return); any other string is read as an INDIGO ``userName``, which is\n  how a consumer holding only a username can keep using this field.\n* ``iam_user_id`` — the INDIGO account id, as the member card carries it. The\n  only way to address a member that exists in INDIGO but has no portal record.\n* ``preferred_username`` — the INDIGO ``userName``, which is the Entra object id\n  the portal writes when it creates the account.\n\nA not-yet-provisioned invitee has no INDIGO account, so they go through the\ninvite flow instead, which waits on provisioning."
      properties:
        iam_user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Iam User Id
        portal_user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: username
        preferred_username:
          anyOf:
          - type: string
          - type: 'null'
          title: Preferred Username
      title: ExternalMemberAddRequest
      type: object
    ExternalMemberAddResponse:
      properties:
        status:
          title: Status
          type: string
      required:
      - status
      title: ExternalMemberAddResponse
      type: object
    ExternalMemberRemoveResponse:
      properties:
        status:
          title: Status
          type: string
      required:
      - status
      title: ExternalMemberRemoveResponse
      type: object
    ExternalUserLookupResponse:
      properties:
        display_name:
          title: Display Name
          type: string
        has_iam_account:
          title: Has Iam Account
          type: boolean
        portal_user_id:
          format: uuid
          title: Portal User Id
          type: string
        preferred_username:
          anyOf:
          - type: string
          - type: 'null'
          description: The Entra object id, which is also the user's INDIGO userName and the preferred_username claim of their INDIGO token. Null until the account exists in Entra. Not the same as Entra's own preferred_username claim, which is a UPN.
          title: Preferred Username
        status:
          title: Status
          type: string
      required:
      - portal_user_id
      - display_name
      - status
      - has_iam_account
      title: ExternalUserLookupResponse
      type: object
    ExternalUserSearchItem:
      properties:
        display_name:
          title: Display Name
          type: string
        email:
          title: Email
          type: string
        has_iam_account:
          title: Has Iam Account
          type: boolean
        portal_user_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Portal User Id
        preferred_username:
          anyOf:
          - type: string
          - type: 'null'
          description: The Entra object id, which is also the user's INDIGO userName and the preferred_username claim of their INDIGO token. Null until the account exists in Entra. Not the same as Entra's own preferred_username claim, which is a UPN.
          title: Preferred Username
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      required:
      - portal_user_id
      - display_name
      - email
      - status
      - has_iam_account
      title: ExternalUserSearchItem
      type: object
    ExternalUserSearchResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/ExternalUserSearchItem'
          title: Results
          type: array
      required:
      - results
      title: ExternalUserSearchResponse
      type: object
    ExternalUserStatusResponse:
      properties:
        portal_user_id:
          format: uuid
          title: Portal User Id
          type: string
        preferred_username:
          anyOf:
          - type: string
          - type: 'null'
          description: The Entra object id, which is also the user's INDIGO userName and the preferred_username claim of their INDIGO token. Null until the account exists in Entra. Not the same as Entra's own preferred_username claim, which is a UPN.
          title: Preferred Username
        status:
          title: Status
          type: string
      required:
      - portal_user_id
      - status
      title: ExternalUserStatusResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    INDIGO client credentials:
      scheme: bearer
      type: http
info:
  title: SKAO User Portal — External (SV Ideas) API
  version: 0.1.0
  x-contract-version: '1.1'
openapi: 3.1.0
paths:
  /api/external/v1/groups:
    post:
      operationId: create_group_api_external_v1_groups_post
      parameters:
      - description: 'The INDIGO account id of the user this write acts for. Required: it is the basis of the ownership checks and it is recorded on every audit event.'
        in: header
        name: X-Acting-User
        required: true
        schema:
          description: 'The INDIGO account id of the user this write acts for. Required: it is the basis of the ownership checks and it is recorded on every audit event.'
          title: X-Acting-User
          type: string
      - description: 'A key unique to this attempt. Required. Replaying it returns the first response with Idempotency-Replayed: true.'
        in: header
        name: Idempotency-Key
        required: true
        schema:
          description: 'A key unique to this attempt. Required. Replaying it returns the first response with Idempotency-Replayed: true.'
          maxLength: 128
          title: Idempotency-Key
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalGroupCreateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGroupCard'
          description: The group already existed and is returned unchanged.
          headers:
            Idempotency-Replayed:
              description: Present and 'true' when this body is a replay of the first request that used this Idempotency-Key, rather than a fresh write.
              schema:
                enum:
                - 'true'
                type: string
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGroupCard'
          description: Successful Response
          headers:
            Idempotency-Replayed:
              description: Present and 'true' when this body is a replay of the first request that used this Idempotency-Key, rather than a fresh write.
              schema:
                enum:
                - 'true'
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: The bearer token is missing, malformed, expired or not allowlisted.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: The token lacks a scope this route requires.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: No such group, invite or member.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: 'The resource is in a state this operation refuses: another owner, a non-mutable group, an invite that is no longer pending, or a parent group still being created.'
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ExternalError'
                - $ref: '#/components/schemas/HTTPValidationError'
          description: Request invalid. Either a one-sentence detail from this API or FastAPI's array of field-level validation errors.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: The client's rate limit for this window is spent.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: INDIGO IAM could not be reached. Retry with the same Idempotency-Key.
      security:
      - INDIGO client credentials: []
      summary: Create Group
      tags:
      - external-sv-ideas
  /api/external/v1/groups/{group_name}:
    delete:
      operationId: delete_group_api_external_v1_groups__group_name__delete
      parameters:
      - description: 'The consumer-minted group name. One path segment: a nested name travels with its ''/'' percent-encoded as %2F. '':'' needs no encoding.'
        in: path
        name: group_name
        required: true
        schema:
          description: 'The consumer-minted group name. One path segment: a nested name travels with its ''/'' percent-encoded as %2F. '':'' needs no encoding.'
          maxLength: 128
          pattern: ^[A-Za-z0-9._/:-]+$
          title: Group Name
          type: string
      - description: 'The INDIGO account id of the user this write acts for. Required: it is the basis of the ownership checks and it is recorded on every audit event.'
        in: header
        name: X-Acting-User
        required: true
        schema:
          description: 'The INDIGO account id of the user this write acts for. Required: it is the basis of the ownership checks and it is recorded on every audit event.'
          title: X-Acting-User
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGroupDeleteResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: The bearer token is missing, malformed, expired or not allowlisted.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: The token lacks a scope this route requires.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: No such group, invite or member.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: 'The resource is in a state this operation refuses: another owner, a non-mutable group, an invite that is no longer pending, or a parent group still being created.'
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ExternalError'
                - $ref: '#/components/schemas/HTTPValidationError'
          description: Request invalid. Either a one-sentence detail from this API or FastAPI's array of field-level validation errors.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: The client's rate limit for this window is spent.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: INDIGO IAM could not be reached. Retry with the same Idempotency-Key.
      security:
      - INDIGO client credentials: []
      summary: Delete Group
      tags:
      - external-sv-ideas
    get:
      operationId: get_group_api_external_v1_groups__group_name__get
      parameters:
      - description: 'The consumer-minted group name. One path segment: a nested name travels with its ''/'' percent-encoded as %2F. '':'' needs no encoding.'
        in: path
        name: group_name
        required: true
        schema:
          description: 'The consumer-minted group name. One path segment: a nested name travels with its ''/'' percent-encoded as %2F. '':'' needs no encoding.'
          maxLength: 128
          pattern: ^[A-Za-z0-9._/:-]+$
          title: Group Name
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGroupCard'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: The bearer token is missing, malformed, expired or not allowlisted.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: The token lacks a scope this route requires.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: No such group, invite or member.
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ExternalError'
                - $ref: '#/components/schemas/HTTPValidationError'
          description: Request invalid. Either a one-sentence detail from this API or FastAPI's array of field-level validation errors.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: The client's rate limit for this window is spent.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: INDIGO IAM could not be reached. Retry with the same Idempotency-Key.
      security:
      - INDIGO client credentials: []
      summary: Get Group
      tags:
      - external-sv-ideas
  /api/external/v1/groups/{group_name}/invites:
    post:
      operationId: create_invite_api_external_v1_groups__group_name__invites_post
      parameters:
      - in: path
        name: group_name
        required: true
        schema:
          title: Group Name
          type: string
      - description: 'The INDIGO account id of the user this write acts for. Required: it is the basis of the ownership checks and it is recorded on every audit event.'
        in: header
        name: X-Acting-User
        required: true
        schema:
          description: 'The INDIGO account id of the user this write acts for. Required: it is the basis of the ownership checks and it is recorded on every audit event.'
          title: X-Acting-User
          type: string
      - description: 'A key unique to this attempt. Required. Replaying it returns the first response with Idempotency-Replayed: true.'
        in: header
        name: Idempotency-Key
        required: true
        schema:
          description: 'A key unique to this attempt. Required. Replaying it returns the first response with Idempotency-Replayed: true.'
          maxLength: 128
          title: Idempotency-Key
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalInviteCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalInviteCard'
          description: Successful Response
          headers:
            Idempotency-Replayed:
              description: Present and 'true' when this body is a replay of the first request that used this Idempotency-Key, rather than a fresh write.
              schema:
                enum:
                - 'true'
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: The bearer token is missing, malformed, expired or not allowlisted.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: The token lacks a scope this route requires.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: No such group, invite or member.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: 'The resource is in a state this operation refuses: another owner, a non-mutable group, an invite that is no longer pending, or a parent group still being created.'
        '422':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ExternalError'
                - $ref: '#/components/schemas/HTTPValidationError'
          description: Request invalid. Either a one-sentence detail from this API or FastAPI's array of field-level validation errors.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: The client's rate limit for this window is spent.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalError'
          description: INDIGO IAM could not be reached. Retry with the same Idempotency-Key.
      security:
      - INDIGO client credentials: []
      summary: Create Invite
