  /api/external/v1/invites:
    get:
      description: 'Invites ordered by ``updated_at`` then ``id``, filtered and capped.


        Page with ``updated_since``: re-read from the newest ``updated_at`` you have

        seen, a little earlier to overlap, and treat items idempotently, because any

        update re-delivers a row at its new position. De-duplicate on ``invite_id``.


        A row is withheld until its ``updated_at`` is a couple of seconds old, so a

        row committed during a page read cannot slip behind a position you have

        already passed. A page never stops inside a block of rows that share one

        ``updated_at``, so it may return more than ``limit`` rows; without that you

        could not page past such a block at all. ``invited_by`` scopes the feed to one

        PI''s invites.


        ``status`` matches the same wall-clock status the card reports, so a pending

        invite whose expiry has passed answers ``status=expired`` and not

        ``status=pending``, whether or not the hourly sweep has run.


        ``next_cursor`` is always null and ``cursor`` is ignored. Both remain so a

        consumer written against the signed-cursor feed keeps working.'
      operationId: list_invites_api_external_v1_invites_get
      parameters:
      - in: query
        name: updated_since
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated Since
      - in: query
        name: group_name
        required: false
        schema:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Group Name
      - description: IAM sub of the inviting PI (a PI's own invites).
        in: query
        name: invited_by
        required: false
        schema:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          description: IAM sub of the inviting PI (a PI's own invites).
          title: Invited By
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - pattern: ^(pending|accepted|rejected|expired|revoked)$
            type: string
          - type: 'null'
          title: Status
      - deprecated: true
        description: Accepted and ignored. Page with updated_since instead.
        in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          deprecated: true
          description: Accepted and ignored. Page with updated_since instead.
          title: Cursor
      - in: query
        name: limit
        required: false
        schema:
          default: 500
          maximum: 5000
          minimum: 1
          title: Limit
          type: integer
