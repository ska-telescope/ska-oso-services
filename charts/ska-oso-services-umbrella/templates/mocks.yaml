{{- $skaOsoServices := index .Values "ska-oso-services" }}
{{- if and $skaOsoServices $skaOsoServices.pipeline_test_deployment }}
{{- /*
Prism mocks of the external servers the app calls, so k8s-test never depends on them:
Indigo IAM, for the User Portal's client-credentials token, and the User Portal itself.
*/}}
{{- range $mock := list "iam-mock" "user-portal-mock" }}
{{- $spec := $.Files.Get (printf "files/%s.openapi.yaml" $mock) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ska-oso-services-{{ $.Release.Name }}-{{ $mock }}-spec
  namespace: {{ $.Release.Namespace }}
  labels:
    release: {{ $.Release.Name }}
    app: ska-oso-services-umbrella-{{ $mock }}
data:
  spec.yaml: |
{{ $spec | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ska-oso-services-{{ $.Release.Name }}-{{ $mock }}
  namespace: {{ $.Release.Namespace }}
  labels:
    release: {{ $.Release.Name }}
    app: ska-oso-services-umbrella-{{ $mock }}
spec:
  ports:
  - port: 4010
  selector:
    app: ska-oso-services-{{ $mock }}
    release: {{ $.Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ska-oso-services-{{ $.Release.Name }}-{{ $mock }}
  namespace: {{ $.Release.Namespace }}
  labels:
    release: {{ $.Release.Name }}
    app: ska-oso-services-umbrella-{{ $mock }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ska-oso-services-{{ $mock }}
      release: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app: ska-oso-services-{{ $mock }}
        release: {{ $.Release.Name }}
      annotations:
        # Prism reads the spec once, so restart it when the spec changes
        checksum/spec: {{ $spec | sha256sum }}
    spec:
      containers:
      - name: prism
        image: stoplight/prism:latest
        command:
        - node
        - /usr/src/prism/packages/cli/dist/index.js
        - mock
        - -h
        - "0.0.0.0"
        - -p
        - "4010"
        - --no-multiprocess
        - /etc/prism/spec.yaml
        ports:
        - containerPort: 4010
        volumeMounts:
        - name: spec
          mountPath: /etc/prism
          readOnly: true
      volumes:
      - name: spec
        configMap:
          name: ska-oso-services-{{ $.Release.Name }}-{{ $mock }}-spec
{{- end }}
{{- end }}
