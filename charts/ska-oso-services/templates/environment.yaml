apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "ska-oso-services.resource-name" . }}-environment
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ska-oso-services.labels" . | indent 4 }}
data:
  LOG_LEVEL: {{ .Values.rest.logLevel }}
  API_PATH_PREFIX: {{ include "ska-oso-services.api-path" . | quote }}
  PIPELINE_TESTS_DEPLOYMENT: {{ .Values.pipeline_test_deployment | quote }}
  SKA_AUTH_AUDIENCE: {{ .Values.rest.authAudiences | join "," | quote }}
  SDP_SCRIPT_TMDATA: {{ .Values.global.oso.sdp_tmdata }}
  ENGINEERING_API_ENABLED: {{ .Values.rest.engineeringApiEnabled | quote }}
  USER_PORTAL_BASE_URL: {{ if .Values.pipeline_test_deployment }}{{ printf "http://%s-user-portal-mock:4010" (include "ska-oso-services.resource-name" .) | quote }}{{ else }}{{ .Values.rest.userPortalBaseUrl | quote }}{{ end }}
  USER_PORTAL_TIMEOUT: {{ .Values.rest.userPortalTimeout | quote }}
  USER_PORTAL_TOKEN_URL: {{ if .Values.pipeline_test_deployment }}{{ printf "http://%s-iam-mock:4010/token" (include "ska-oso-services.resource-name" .) | quote }}{{ else }}{{ .Values.rest.userPortalTokenUrl | quote }}{{ end }}
  USER_PORTAL_CLIENT_ID: {{ .Values.rest.userPortalClientId | quote }}
  USER_PORTAL_TOKEN_SCOPE: {{ .Values.rest.userPortalTokenScope | quote }}
  USER_PORTAL_TOKEN_AUDIENCE: {{ .Values.rest.userPortalTokenAudience | quote }}
  AWS_PHT_BUCKET_NAME: {{ .Values.rest.awsPhtBucketName | quote }}
  AWS_REGION: {{ .Values.rest.awsRegion | quote }}