---
suite: ska-oso-services-environment
templates:
  - environment.yaml
tests:
  - it: should contain only one document.
    asserts:
      - hasDocuments:
          count: 1

  - it: should set PIPELINE_TESTS_DEPLOYMENT to false.
    asserts:
      - equal:
          path: data.PIPELINE_TESTS_DEPLOYMENT
          value:
            "false"

  - it: should set SKA_AUTH_AUDIENCE with Indigo and Entra audiences.
    asserts:
      - equal:
          path: data.SKA_AUTH_AUDIENCE
          value: "test:pht,test:odt,api://e4d6bb9b-cdd0-46c4-b30a-d045091b501b"

  - it: should be of type ConfigMap and have the correct apiVersion, v1.
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap
      - isAPIVersion:
          of: v1

  - it: should use a static User Portal token when no token URL is set.
    asserts:
      - equal:
          path: data.USER_PORTAL_API_KEY
          value: ""
      - notExists:
          path: data.USER_PORTAL_TOKEN_URL

  - it: should configure the User Portal client-credentials grant when a token URL is set.
    set:
      rest.userPortalTokenUrl: https://iam.example.org/token
      rest.userPortalClientId: test-client
      rest.userPortalTokenScope: "portal:read portal:write"
    asserts:
      - equal:
          path: data.USER_PORTAL_TOKEN_URL
          value: https://iam.example.org/token
      - equal:
          path: data.USER_PORTAL_CLIENT_ID
          value: test-client
      - equal:
          path: data.USER_PORTAL_TOKEN_SCOPE
          value: "portal:read portal:write"
      - notExists:
          path: data.USER_PORTAL_TOKEN_AUDIENCE

  - it: should use the mock portal with a placeholder token in pipeline test deployments.
    set:
      pipeline_test_deployment: true
      rest.userPortalTokenUrl: https://iam.example.org/token
    asserts:
      - equal:
          path: data.USER_PORTAL_API_KEY
          value: pipeline-test-token
      - notExists:
          path: data.USER_PORTAL_TOKEN_URL
