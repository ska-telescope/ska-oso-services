---
suite: ska-oso-services-environment
templates:
  - environment.yaml
tests:
  - it: should contain only one document.
    asserts:
      - hasDocuments:
          count: 1

  - it: should set PIPELINE_TESTS_DEPLOYMENT to false.
    asserts:
      - equal:
          path: data.PIPELINE_TESTS_DEPLOYMENT
          value:
            "false"

  - it: should set SKA_AUTH_AUDIENCE with Indigo and Entra audiences.
    asserts:
      - equal:
          path: data.SKA_AUTH_AUDIENCE
          value: "test:pht,test:odt,api://e4d6bb9b-cdd0-46c4-b30a-d045091b501b"

  - it: should be of type ConfigMap and have the correct apiVersion, v1.
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap
      - isAPIVersion:
          of: v1

  - it: should configure the User Portal client-credentials grant against staging Indigo by default.
    asserts:
      - equal:
          path: data.USER_PORTAL_TOKEN_URL
          value: https://iam-1.staging.devx.skao.int/token
      - equal:
          path: data.USER_PORTAL_CLIENT_ID
          value: 80e7100b-6ada-486a-b82c-8a159ddeda4d
      - equal:
          path: data.USER_PORTAL_TOKEN_SCOPE
          value: "portal:users.read portal:groups.read portal:groups.write portal:invites.read portal:invites.write"
      - equal:
          path: data.USER_PORTAL_TOKEN_AUDIENCE
          value: test:portal

  - it: should use the configured User Portal token scope and audience.
    set:
      rest.userPortalTokenScope: "portal:users.read"
      rest.userPortalTokenAudience: live:portal
    asserts:
      - equal:
          path: data.USER_PORTAL_TOKEN_SCOPE
          value: "portal:users.read"
      - equal:
          path: data.USER_PORTAL_TOKEN_AUDIENCE
          value: live:portal

  - it: should keep the real token grant in pipeline test deployments.
    set:
      pipeline_test_deployment: true
    asserts:
      - equal:
          path: data.USER_PORTAL_TOKEN_URL
          value: https://iam-1.staging.devx.skao.int/token
